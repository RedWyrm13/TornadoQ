[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "tornadoq"
version = "0.1.0"
description = "Tornado Q: data preprocessing and classical baselines for EF prediction"
authors = [{ name = "Your Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
"pandas>=2.0",
"numpy>=1.26",
"scikit-learn>=1.4",
"imbalanced-learn>=0.12",
"typer>=0.12",
"matplotlib>=3.8",
"xgboost>=2.0; platform_machine != 'aarch64'",
]


[project.optional-dependencies]
dev = [
"pytest>=8.0",
"pytest-cov>=5.0",
"mypy>=1.10",
"ruff>=0.6",
"types-PyYAML",
]


[tool.ruff]
line-length = 100
select = ["E","F","I","B","UP"]


[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true


[tool.setuptools.packages.find]
where = ["src"]